plugins { id 'java' }
group = 'cn.mits'
version = '1.0.0'
// Compile against Java 17 APIs without requiring a separate JDK 17 toolchain.
// This also allows the build to run on newer installed JDKs such as Java 25.
repositories {
    mavenCentral()
    maven { name = 'ViaVersion'; url = 'https://repo.viaversion.com/everything' }
}
dependencies {
    // 26.3 packet and NBT component types are supplied by ViaProxy 3.4.14.
    compileOnly('net.raphimc:ViaProxy:3.4.14') { transitive = false }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
jar { archiveFileName = 'nekogate-viaproxy-plugin.jar' }
