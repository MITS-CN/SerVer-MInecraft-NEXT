name: ViaProxy chat plugin
on:
  push:
    branches: [main]
    paths: ["viaproxy-plugin/**", ".github/workflows/viaproxy-plugin.yml"]
  pull_request:
    paths: ["viaproxy-plugin/**", ".github/workflows/viaproxy-plugin.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: gradle -p viaproxy-plugin clean build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: nekogate-viaproxy-plugin
          path: viaproxy-plugin/build/libs/nekogate-viaproxy-plugin.jar
